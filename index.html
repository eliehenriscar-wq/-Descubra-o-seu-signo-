<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra o seu Signo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        
        <!-- Tela do Formulário -->
        <div id="tela-formulario" class="card shadow-lg border-0 main-card">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="mb-4">
                    <span class="zodiac-icon">✨</span>
                    <h1 class="display-5 fw-bold text-primary mb-2">Descubra o seu Signo</h1>
                    <p class="text-muted">Informe sua data de nascimento e descubra as características do seu signo</p>
                </div>

                <form id="form-signo">
                    <div class="mb-4">
                        <label for="data_nascimento" class="form-label fw-semibold">Data de Nascimento</label>
                        <input 
                            type="date" 
                            class="form-control form-control-lg text-center" 
                            id="data_nascimento" 
                            name="data_nascimento" 
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-semibold">
                        Descobrir meu signo 🔮
                    </button>
                </form>
            </div>
        </div>

        <!-- Tela do Resultado -->
        <div id="tela-resultado" class="card shadow-lg border-0 result-card d-none">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="signo-emoji mb-3" id="emoji-signo"></div>
                    <h1 class="display-4 fw-bold text-primary" id="nome-signo"></h1>
                    <p class="lead text-muted mb-1">Você nasceu em <strong id="data-formatada"></strong></p>
                    <span class="badge bg-primary-subtle text-primary fs-6 px-3 py-2" id="periodo-signo"></span>
                </div>

                <div class="row g-4 mt-3">
                    <div class="col-md-6">
                        <div class="info-box">
                            <h5 class="fw-bold text-primary">Elemento</h5>
                            <p class="mb-0" id="elemento-signo"></p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-box">
                            <h5 class="fw-bold text-primary">Planeta Regente</h5>
                            <p class="mb-0" id="planeta-signo"></p>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <h5 class="fw-bold text-primary mb-3">Principais Características</h5>
                    <p class="fs-5 lh-base" id="caracteristicas-signo"></p>
                </div>

                <div class="mt-4">
                    <h5 class="fw-bold text-primary mb-3">Personalidade</h5>
                    <p class="text-secondary" id="descricao-signo"></p>
                </div>

                <div class="d-grid gap-2 mt-5">
                    <button id="btn-voltar" class="btn btn-outline-primary btn-lg">
                        ← Descobrir outro signo
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center text-white d-none">
            <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;"></div>
            <p class="mt-3">Consultando as estrelas...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
